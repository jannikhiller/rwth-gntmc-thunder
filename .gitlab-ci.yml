image: "rust:latest"

cache:
    paths:
        - target/

stages:
#    - sec_check
    - test
    - build
    - release
    - docs

variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/packages/generic"


# The following is currently deactivated as it takes a lot of time
# (because the cargo commands must be installed)
# and is not really necessary for the scope of this project
# When reactivating one might consider to only execute them on events
# of a merge request (and maybe before a release)

# check dependencies
